<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jose Altamirano — Books & Photography</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <h1>
            JOSE ALTAMIRANO
        </h1>

        <p>
            BOOKS / PHOTOGRAPHY
        </p>

    </header>


  <main class="bookshelf-area">

    <div class="books">

        <!-- SUMMER BOOK -->
        <div class="book-item summer-item">

            <a
                class="book-link summer-book"
                href="summer/"
                aria-label="Open Somewhere to Be"
            >
                <div class="book-glow"></div>

                <img
                    src="images/summer-cover.jpg"
                    alt="Somewhere to Be book cover"
                >
            </a>

            <div class="mini-shelf summer-shelf" aria-hidden="true">
                <svg viewBox="0 0 360 34" preserveAspectRatio="none">
                    <path
                        class="shelf-line shelf-line-top"
                        d="M8 12 C55 10, 105 14, 160 12 C215 10, 275 14, 352 11"
                    />
                    <path
                        class="shelf-line shelf-line-bottom"
                        d="M10 18 C62 16, 112 20, 165 18 C222 16, 282 20, 350 17"
                    />
                    <path
                        class="shelf-line shelf-line-shadow"
                        d="M18 24 C80 23, 145 25, 205 24 C265 23, 315 25, 340 24"
                    />
                </svg>
            </div>

            <div class="book-label">
                <p class="book-title">SOMEWHERE TO BE</p>
                <p class="book-year">2026</p>
            </div>

        </div>


        <!-- LIGHT BETWEEN THE BUILDINGS -->
        <div class="book-item light-item">

            <a
                class="book-link light-book"
                href="light-between-the-buildings/"
                aria-label="Open Light Between the Buildings"
            >
                <div class="book-glow"></div>

                <img
                    src="images/light-cover.jpg"
                    alt="Light Between the Buildings book cover"
                >
            </a>

            <div class="mini-shelf light-shelf" aria-hidden="true">
                <svg viewBox="0 0 260 34" preserveAspectRatio="none">
                    <path
                        class="shelf-line shelf-line-top"
                        d="M8 12 C42 10, 82 14, 126 12 C170 10, 208 14, 252 11"
                    />
                    <path
                        class="shelf-line shelf-line-bottom"
                        d="M10 18 C48 16, 88 20, 128 18 C172 16, 214 20, 250 17"
                    />
                    <path
                        class="shelf-line shelf-line-shadow"
                        d="M16 24 C58 23, 98 25, 140 24 C182 23, 218 25, 244 24"
                    />
                </svg>
            </div>

            <div class="book-label">
                <p class="book-title">LIGHT BETWEEN THE BUILDINGS</p>
                <p class="book-year">2026</p>
            </div>

        </div>

    </div>

</main>

</body>

</html>
