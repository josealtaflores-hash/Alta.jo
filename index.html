<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Altamirano — Documentary Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <h1>JOSE ALTAMIRANO</h1>
    <p>DOCUMENTARY PHOTOGRAPHY</p>
</header>

<main>
    <section class="book-area" aria-label="Photography book">

        <button class="arrow-button" id="previous-button" type="button" aria-label="Previous spread">
            <svg viewBox="0 0 60 60" aria-hidden="true">
                <path class="sketch-circle circle-one" d="M30 5 C45 4, 56 16, 55 30 C55 45, 44 56, 29 55 C14 56, 4 44, 5 29 C4 15, 16 5, 30 5"/>
                <path class="sketch-circle circle-two" d="M29 7 C43 5, 54 17, 53 31 C54 44, 42 54, 29 53 C16 55, 6 43, 7 30 C5 17, 16 7, 29 7"/>
                <path class="sketch-arrow" d="M35 20 L24 30 L35 40"/>
            </svg>
        </button>

        <div class="book" id="book">
            <div class="page left-page">
                <img id="left-page-image" src="images/001.jpg" alt="Left page of the photography book">
            </div>

            <div class="page right-page">
                <img id="right-page-image" src="images/002.jpg" alt="Right page of the photography book">
            </div>
        </div>

        <button class="arrow-button" id="next-button" type="button" aria-label="Next spread">
            <svg viewBox="0 0 60 60" aria-hidden="true">
                <path class="sketch-circle circle-one" d="M30 5 C45 4, 56 16, 55 30 C55 45, 44 56, 29 55 C14 56, 4 44, 5 29 C4 15, 16 5, 30 5"/>
                <path class="sketch-circle circle-two" d="M29 7 C43 5, 54 17, 53 31 C54 44, 42 54, 29 53 C16 55, 6 43, 7 30 C5 17, 16 7, 29 7"/>
                <path class="sketch-arrow" d="M25 20 L36 30 L25 40"/>
            </svg>
        </button>

    </section>

    <p class="page-number" id="page-number">1–2</p>
</main>

<<div class="end-popup" id="end-popup" aria-hidden="true">

    <div class="end-popup-panel">

        <button
            class="popup-close"
            id="popup-close"
            type="button"
            aria-label="Close"
        >
            ×
        </button>

        <p class="popup-eyebrow">
            THE END
        </p>

        <h2>
            Thanks for looking.
        </h2>

        <p class="popup-copy">
            The book ends here. The photos don't.
        </p>

        <div class="popup-links">

            <a
                id="instagram-link"
                class="popup-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Follow along on Instagram →
            </a>

            <a
                id="purchase-link"
                class="popup-link popup-link-primary"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Get the book →
            </a>

        </div>

        <button
            class="restart-book"
            id="restart-book"
            type="button"
        >
            Take another look
        </button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
