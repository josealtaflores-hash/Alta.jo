<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jose Altamirano</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="brand-block">
      <a href="./" class="site-name">JOSE ALTAMIRANO</a>
      <span class="site-role">DOCUMENTARY PHOTOGRAPHER</span>
    </div>

    <nav class="site-nav">
      <a
        href="https://www.instagram.com/alta.jo/"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
        class="instagram-link"
      >
        <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5"></rect>
          <circle cx="12" cy="12" r="4.15"></circle>
          <circle cx="17.45" cy="6.75" r="1"></circle>
        </svg>
      </a>
    </nav>
  </header>

  <main id="books" class="books">

    <article
      class="project project-summer"
      data-theme="summer"
    >
      <div class="project-meta">
        <span class="project-number">01</span>

        <div>
          <h1>SOMEWHERE TO BE</h1>
          <p>PHOTO BOOK / 2026</p>
        </div>
      </div>

      <a
        href="Summer/"
        class="book-link"
        aria-label="View Somewhere to Be"
      >
        <div class="book-wrap">
          <img
            src="images/summer-cover.jpg"
            alt="Somewhere to Be"
            class="book"
          >
        </div>

        <div class="shelf">
          <span></span>
        </div>

        <div class="view-project">
          VIEW PROJECT →
        </div>
      </a>
    </article>

    <article
      class="project project-light"
      data-theme="light"
    >
      <div class="project-meta">
        <span class="project-number">02</span>

        <div>
          <h1>LIGHT BETWEEN THE BUILDING</h1>
          <p>PHOTOZINE / 2026</p>
        </div>
      </div>

      <a
        href="light-between-the-buildings/"
        class="book-link"
        aria-label="View Light Between the Building"
      >
        <div class="book-wrap smaller">
          <img
            src="images/light-cover.jpg"
            alt="Light Between the Building"
            class="book"
          >
        </div>

        <div class="shelf">
          <span></span>
        </div>

        <div class="view-project">
          VIEW PROJECT →
        </div>
      </a>
    </article>

  </main>

  <footer class="site-footer">
    <p>PHOTOGRAPHS, BOOKS, ZINES</p>

    <a
      href="https://www.instagram.com/alta.jo/"
      target="_blank"
      rel="noopener"
    >
      @ALTA.JO
    </a>
  </footer>

  <script src="script.js"></script>

</body>
</html>
