<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Somewhere to Be — Digital Edition</title>
<link href="style.css" rel="stylesheet"/>
<style>
.download-page{min-height:100vh;display:grid;place-items:center;padding:40px 22px;background:#f3ede2;}
.download-card{width:min(720px,100%);border:1px solid rgba(0,0,0,.45);padding:clamp(28px,6vw,64px);background:rgba(255,255,255,.12);}
.download-kicker{font-size:12px;letter-spacing:.18em;margin:0 0 18px;}
.download-card h1{font-size:clamp(32px,7vw,68px);font-weight:400;line-height:.98;margin:0 0 24px;}
.download-copy{max-width:560px;font-size:15px;line-height:1.65;margin:0 0 30px;}
.download-button{display:inline-block;border:1px solid currentColor;padding:14px 18px;text-decoration:none;color:inherit;letter-spacing:.08em;font-size:12px;}
.download-back{display:block;margin-top:24px;color:inherit;font-size:11px;letter-spacing:.08em;text-decoration:none;}
</style>
</head>
<body>
<main class="download-page">
<section class="download-card" aria-labelledby="download-title">
<p class="download-kicker">THANK YOU FOR SUPPORTING THE PROJECT</p>
<h1 id="download-title">SOMEWHERE TO BE</h1>
<p class="download-copy">Your digital edition is ready. Click below to download the screen-optimized PDF.</p>
<a class="download-button" href="downloads/somewhere-to-be-screen-preview.pdf" download>DOWNLOAD PDF →</a>
<a class="download-back" href="index.html">← RETURN TO THE BOOK</a>
</section>
</main>
</body>
</html>
